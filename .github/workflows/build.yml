name: Build Android Kernel for Xperia XZ1

on:
  workflow_dispatch: # Cho phép bấm nút kích hoạt thủ công trên điện thoại

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Cài đặt môi trường & Công cụ Build
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential bc libncurses5-dev libssl-dev bison flex libelf-dev git ccache clang llvm

    - name: Tải Toolchain (GCC/Clang cho AArch64)
      run: |
        git clone https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 -b android10-gsi --depth=1 toolchain

    - name: Tải Source Kernel Xperia XZ1
      run: |
        # Thay đường dẫn link git kernel dưới đây nếu bạn dùng bản kernel tùy chỉnh khác
        git clone https://github.com/sonyxperiadev/kernel.git -b aosp/LE.UM.1.3.r1 --depth=1 kernel_source

    - name: Cấu hình và Biên dịch Kernel
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=$(pwd)/toolchain/bin/aarch64-linux-android-
        cd kernel_source
        
        # Tạo file cấu hình (.config) cho XZ1 poplar
        make poplar_defconfig
        
        # Tiến hành build nhân
        make -j$(nproc)

    - name: Đóng gói và Lưu trữ Thành phẩm
      uses: actions/upload-artifact@v3
      with:
        name: Kernel-XZ1-Poplar
        path: |
          kernel_source/arch/arm64/boot/Image.gz-dtb
          kernel_source/arch/arm64/boot/boot.img
